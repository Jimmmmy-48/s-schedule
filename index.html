<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排班系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div style="display:flex;align-items:center;gap:8px">
      <h1>排班系統</h1>
      <span class="header-sub">兩週排班・早班 / 晚班</span>
    </div>
  </header>

  <!-- ── Body ───────────────────────────────────────────────────────────── -->
  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">

      <!-- ─ 排班設定 ─ -->
      <div class="sidebar-section">
        <div class="sidebar-title">排班設定</div>

        <div class="date-row">
          <label for="start-date">排班開始日期</label>
          <input type="date" id="start-date">
        </div>

        <button class="btn btn-primary" onclick="generateSchedule()">
          ⚡ 產生排班
        </button>
      </div>

      <!-- ─ 人員管理 ─ -->
      <div class="sidebar-section">
        <div class="sidebar-title">
          人員管理
          <span id="staff-count" style="color:var(--primary);margin-left:4px">0</span> 人
        </div>

        <div class="staff-input-row">
          <input type="text" id="staff-input"
            placeholder="輸入姓名，Enter 新增"
            autocomplete="off">
          <button class="btn btn-secondary btn-sm" onclick="addStaff()">新增</button>
        </div>

        <div class="form-field">
          <span class="form-label">性別</span>
          <div class="shift-type-group" id="add-gender-group">
            <button class="st-btn" data-value="男" onclick="setAddGender('男')">男</button>
            <button class="st-btn" data-value="女" onclick="setAddGender('女')">女</button>
          </div>
        </div>

        <!-- Default shift type applied to all 14 days on add -->
        <div class="form-field">
          <span class="form-label">新增預設班別</span>
          <div class="shift-type-group" id="shift-type-group">
            <button class="st-btn active" data-value="both"    onclick="setShiftType('both')">早晚班</button>
            <button class="st-btn"        data-value="morning" onclick="setShiftType('morning')">僅早班</button>
            <button class="st-btn"        data-value="evening" onclick="setShiftType('evening')">僅晚班</button>
          </div>
        </div>

        <div class="form-field">
          <span class="form-label">預設偏好路線（早班）</span>
          <select id="add-morning-route" class="route-select"></select>
        </div>
        <div class="form-field">
          <span class="form-label">預設偏好路線（晚班）</span>
          <select id="add-evening-route" class="route-select"></select>
        </div>

        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
          新增後可點擊 ✎ 設定每天的班別
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">
          可貼上多筆，用換行或逗號分隔
        </div>

        <div class="sidebar-link-row">
          <button class="link-btn" onclick="importSampleStaff()">載入人員資料</button>
          <button class="link-btn danger" onclick="clearAllStaff()">清除全部</button>
        </div>
      </div>

      <!-- ─ 店家設定 ─ -->
      <div class="sidebar-section">
        <div class="sidebar-title">店家設定</div>

        <div class="setting-field">
          <label for="setting-store-count">店家總數</label>
          <input type="number" id="setting-store-count" min="1" max="500" value="28"
            oninput="updateStoreCount()">
        </div>

        <div class="sidebar-link-row" style="margin-top:8px">
          <button class="link-btn" onclick="openStoreNamesModal()">自訂店名</button>
        </div>
      </div>

      <!-- ─ Staff List ─ -->
      <div class="sidebar-section">
        <div id="staff-list" class="staff-list">
          <p class="sidebar-empty">尚未新增人員</p>
        </div>
      </div>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <div class="tabs">
        <button class="tab-btn active" data-tab="schedule" onclick="switchTab('schedule')">排班表</button>
        <button class="tab-btn" data-tab="stores"   onclick="switchTab('stores')">店家分配</button>
        <button class="tab-btn" data-tab="stats"    onclick="switchTab('stats')">人員統計</button>
      </div>

      <div class="tab-panels">

        <div class="tab-panel active" id="tab-schedule">
          <div class="empty-state">
            <div class="empty-icon">📅</div>
            <p>請先新增人員，設定開始日期，然後點擊「產生排班」</p>
          </div>
        </div>

        <!-- 店家分配 -->
        <div class="tab-panel" id="tab-stores">
          <div class="empty-state">
            <div class="empty-icon">🏪</div>
            <p>產生排班後可查看店家分配</p>
          </div>
        </div>

        <div class="tab-panel" id="tab-stats">
          <div class="empty-state">
            <div class="empty-icon">📊</div>
            <p>產生排班後可查看統計</p>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- ── Add-to-shift Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="add-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">新增人員</h3>
      <button class="btn-modal-close" onclick="closeAddModal()">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">點選人員加入班表（已排班當日者不顯示）</p>
      <div class="modal-staff-grid" id="modal-staff-list"></div>
    </div>
  </div>
</div>

<!-- ── Edit Staff Modal ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="edit-staff-modal">
  <div class="modal-box modal-box-wide">
    <div class="modal-header">
      <h3>編輯人員設定</h3>
      <button class="btn-modal-close" onclick="closeEditStaffModal()">×</button>
    </div>
    <div class="modal-body">

      <div class="form-field">
        <label class="form-label" for="edit-name-input">姓名</label>
        <input type="text" id="edit-name-input" class="edit-text-input" autocomplete="off">
      </div>

      <div class="form-field">
        <span class="form-label">性別</span>
        <div class="shift-type-group" id="edit-gender-group">
          <button class="st-btn" data-value="男" onclick="setEditGender('男')">男</button>
          <button class="st-btn" data-value="女" onclick="setEditGender('女')">女</button>
        </div>
      </div>

      <!-- Per-day shift type grid -->
      <div class="form-field">
        <div class="dates-header">
          <span class="form-label" style="margin:0">每天班別設定</span>
          <div class="dates-actions">
            <button class="link-btn" onclick="selectAllDates('both')"    title="全部設為早晚班">全選早晚</button>
            <button class="link-btn" onclick="selectAllDates('morning')" title="全部設為早班">全早班</button>
            <button class="link-btn" onclick="selectAllDates('evening')" title="全部設為晚班">全晚班</button>
            <button class="link-btn danger" onclick="clearAllDates()"    title="全部設為不可上班">全不可</button>
          </div>
        </div>

        <div class="date-grid-legend">
          <span class="legend-item legend-both">早晚</span>
          <span class="legend-item legend-morning">早</span>
          <span class="legend-item legend-evening">晚</span>
          <span class="legend-item legend-off">✕ 不可</span>
          <span class="legend-hint">點擊切換</span>
        </div>

        <div class="date-grid" id="edit-dates-grid"></div>

        <p class="dates-week-label">
          <span>← 第 1 週</span><span>第 2 週 →</span>
        </p>
      </div>

      <!-- Per-shift route preference -->
      <div class="form-field">
        <span class="form-label">偏好路線（早班）</span>
        <div class="route-pref-group" id="morning-route-pref"></div>
      </div>
      <div class="form-field">
        <span class="form-label">偏好路線（晚班）</span>
        <div class="route-pref-group" id="evening-route-pref"></div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeEditStaffModal()">取消</button>
        <button class="btn btn-primary" style="width:auto;padding:7px 20px" onclick="saveEditStaff()">儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Store Names Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="store-names-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>自訂店名</h3>
      <button class="btn-modal-close" onclick="closeStoreNamesModal()">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">每行一個店名，共 <strong id="store-names-count">0</strong> 家</p>
      <textarea id="store-names-textarea" class="store-names-ta"
        placeholder="店1&#10;店2&#10;店3&#10;..."
        rows="12"
        oninput="updateStoreNamesCount()"></textarea>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeStoreNamesModal()">取消</button>
        <button class="btn btn-primary" style="width:auto;padding:7px 20px" onclick="saveStoreNames()">儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script src="js/scheduler.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
